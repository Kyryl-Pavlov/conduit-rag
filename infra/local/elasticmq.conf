# Declarative local SQS queues, mirroring infra/cloud/modules/sqs/main.tf:
# same 3 queues, same DLQs, same visibility timeouts (6x each consuming
# Lambda's timeout) and maxReceiveCount.
include classpath("application.conf")

node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
}

queues {
  dispatch-queue {
    defaultVisibilityTimeout = 180 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "dispatch-dlq"
      maxReceiveCount = 3
    }
  }
  dispatch-dlq {
    defaultVisibilityTimeout = 180 seconds
  }

  worker-queue {
    defaultVisibilityTimeout = 720 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "worker-dlq"
      maxReceiveCount = 3
    }
  }
  worker-dlq {
    defaultVisibilityTimeout = 720 seconds
  }

  write-queue {
    defaultVisibilityTimeout = 300 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "write-dlq"
      maxReceiveCount = 3
    }
  }
  write-dlq {
    defaultVisibilityTimeout = 300 seconds
  }
}
